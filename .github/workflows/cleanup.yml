name: Cleanup expired sessions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete expired files
        run: |
          now_ms=$(( $(date +%s) * 1000 ))
          found=0
          for file in data/*.json; do
            [ -e "$file" ] || continue
            expires=$(jq -r '.expiresAt // 0' "$file")
            if [ "$expires" -lt "$now_ms" ]; then
              echo "Deleting $file"
              rm "$file"
              found=$((found + 1))
            fi
          done
          echo "Deleted $found expired files"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A data/
          git commit -m "cleanup: remove expired sessions"
          git push
